openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: clientMORE backend API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: settings
    description: Tenant settings
  - name: files
    description: Knowledge base documents
  - name: handoffs
    description: Human handoff queue
  - name: learn
    description: Learn from Q&A pairs
  - name: analytics
    description: Dashboard analytics
  - name: chat
    description: Public chat / RAG pipeline
  - name: admin
    description: Admin console (X-Admin-Key)
  - name: webhooks
    description: Inbound channel webhooks (Telegram, Twilio/WhatsApp)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: authRegister
      tags: [auth]
      summary: Register a new operator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /auth/login:
    post:
      operationId: authLogin
      tags: [auth]
      summary: Log in with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetail"

  /auth/me:
    get:
      operationId: authMe
      tags: [auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [auth]
      summary: Refresh JWT (sliding-session renewal)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                required: [token]

  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Invalidate session (client-side)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get tenant settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update tenant settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /files:
    get:
      operationId: listFiles
      tags: [files]
      summary: List knowledge-base documents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentFile"

  /upload:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a document (parse, chunk, embed)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"

  /files/{id}:
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a document and its chunks
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /handoffs:
    get:
      operationId: listHandoffs
      tags: [handoffs]
      summary: List handoffs (optionally filter by status / channel)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, resolved]
        - in: query
          name: channel
          schema:
            type: string
      responses:
        "200":
          description: Handoff list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Handoff"

  /handoffs/{id}/reply:
    post:
      operationId: replyHandoff
      tags: [handoffs]
      summary: Send an agent reply to the customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required: [content]
      responses:
        "200":
          description: Updated handoff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handoff"

  /handoffs/{id}/resolve:
    post:
      operationId: resolveHandoff
      tags: [handoffs]
      summary: Mark a handoff as resolved
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /handoffs/{id}/feedback:
    post:
      operationId: handoffFeedback
      tags: [handoffs]
      summary: Submit CSAT score (1-5) for a resolved handoff
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
              required: [score]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /handoffs/{id}/retry-delivery:
    post:
      operationId: retryDelivery
      tags: [handoffs]
      summary: Retry last agent reply delivery
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema:
                type: object

  /learn:
    post:
      operationId: learnAnswer
      tags: [learn]
      summary: Save a Q&A pair and index it as a retrievable chunk
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question:
                  type: string
                answer:
                  type: string
                source_handoff_id:
                  type: integer
              required: [question, answer]
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
                  documentId:
                    type: integer

  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Dashboard analytics (KPIs, top questions, channel distribution, unanswered)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"

  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags: [analytics]
      summary: Alias for /analytics (backward compat)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Analytics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"

  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message and get an AI answer (public — no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

  /chat/{sessionId}/agent-messages:
    get:
      operationId: getAgentMessages
      tags: [chat]
      summary: Poll for agent replies (widget fallback when WebSocket is unavailable)
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
        - in: query
          name: tenant_key
          schema:
            type: string
        - in: query
          name: after_id
          schema:
            type: integer
      responses:
        "200":
          description: Agent messages since after_id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"

  /admin/tenants:
    get:
      operationId: adminListTenants
      tags: [admin]
      summary: List all tenants
      security:
        - adminKey: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: plan
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: adminCreateTenant
      tags: [admin]
      summary: Create a tenant
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                plan:
                  type: string
                limitMessages:
                  type: integer
              required: [name, email]
      responses:
        "200":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /admin/tenants/{id}:
    put:
      operationId: adminUpdateTenant
      tags: [admin]
      summary: Update a tenant
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    delete:
      operationId: adminDeleteTenant
      tags: [admin]
      summary: Delete a tenant
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/tenants/{id}/toggle:
    post:
      operationId: adminToggleTenant
      tags: [admin]
      summary: Toggle tenant active/inactive
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /admin/kpis:
    get:
      operationId: adminKpis
      tags: [admin]
      summary: Global platform KPIs
      security:
        - adminKey: []
      responses:
        "200":
          description: KPIs
          content:
            application/json:
              schema:
                type: object

  /admin/health:
    get:
      operationId: adminHealth
      tags: [admin]
      summary: System health (DB latency, vector store, LLM availability, CPU/RAM)
      security:
        - adminKey: []
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                type: object

  /telegram/webhook:
    post:
      operationId: telegramWebhook
      tags: [webhooks]
      summary: Inbound Telegram update (registered via setWebhook)
      description: |
        Receives updates from Telegram. Validates the `X-Telegram-Bot-Api-Secret-Token`
        header against the tenant's stored secret. Always returns 200 so Telegram
        does not retry on tenant-side errors. The request body is the raw Telegram
        Update object and is not modeled here.
      parameters:
        - name: tenant_key
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Acknowledged (always 200)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /whatsapp/webhook:
    post:
      operationId: whatsappWebhook
      tags: [webhooks]
      summary: Inbound WhatsApp message (Twilio webhook)
      description: |
        Receives WhatsApp messages via Twilio. Validates `X-Twilio-Signature`
        against the tenant's Twilio auth token. Returns an empty TwiML
        `<Response>` document. The request body is Twilio-formatted form data.
      parameters:
        - name: tenant_key
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: TwiML response
          content:
            application/xml:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required: [detail]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        companyName:
          type: string
      required: [email, password, companyName]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthSession:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
        redirectTo:
          type: string
        tenantKey:
          type: string
      required: [token, userId, email, role, redirectTo, tenantKey]

    UserInfo:
      type: object
      properties:
        userId:
          type: integer
        email:
          type: string
        name:
          type: string
          nullable: true
        role:
          type: string
        tenantKey:
          type: string
      required: [userId, email, role, tenantKey]

    Settings:
      type: object
      properties:
        companyName:
          type: string
        botName:
          type: string
        companyLogo:
          type: string
        botTone:
          type: string
        systemPromptExtra:
          type: string
        telegramToken:
          type: string
          nullable: true
        isTelegramActive:
          type: boolean
        twilioSid:
          type: string
          nullable: true
        twilioToken:
          type: string
          nullable: true
        twilioNumber:
          type: string
          nullable: true
        isWhatsappActive:
          type: boolean
        subscriptionPlan:
          type: string
        usedMessages:
          type: integer
        confidenceThreshold:
          type: number
      required: [companyName, botName, botTone, isTelegramActive, isWhatsappActive, subscriptionPlan, usedMessages, confidenceThreshold]

    SettingsPatch:
      type: object
      additionalProperties: true

    DocumentFile:
      type: object
      properties:
        id:
          type: integer
        tenant_key:
          type: string
        name:
          type: string
        size:
          type: string
        type:
          type: string
        chunks:
          type: integer
        date:
          type: string
          format: date-time
        status:
          type: string
      required: [id, name, size, type, chunks, date, status]

    UploadResult:
      type: object
      properties:
        file:
          type: string
        chunks:
          type: integer
        status:
          type: string
      required: [file, chunks, status]

    Handoff:
      type: object
      properties:
        id:
          type: integer
        user:
          type: string
        channel:
          type: string
        reason:
          type: string
        language:
          type: string
        timeAgo:
          type: string
        createdAt:
          type: string
          format: date-time
        unreplied:
          type: boolean
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        metadata:
          type: object
      required: [id, user, channel, reason, timeAgo, createdAt, unreplied, messages]

    Message:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
        content:
          type: string
        time:
          type: string
          format: date-time
      required: [id, role, content, time]

    Analytics:
      type: object
      properties:
        kpis:
          type: object
          properties:
            total_questions:
              type: integer
            deflection_rate:
              type: number
            cost_savings:
              type: number
            feedback_score:
              type: number
        top_questions:
          type: array
          items:
            type: object
        channel_distribution:
          type: array
          items:
            type: object
        unanswered:
          type: array
          items:
            type: object
      required: [kpis, top_questions, channel_distribution, unanswered]

    ChatRequest:
      type: object
      properties:
        session_id:
          type: string
        message:
          type: string
        channel:
          type: string
        tenantKey:
          type: string
        tenant_key:
          type: string
      required: [session_id, message]

    ChatResponse:
      type: object
      properties:
        answer:
          type: string
        confidence:
          type: number
        handoff:
          type: object
          nullable: true
          properties:
            id:
              type: integer
        language:
          type: string
        escalate:
          type: boolean
        sender:
          type: string
      required: [answer, confidence]

    Tenant:
      type: object
      properties:
        id:
          type: integer
        tenantKey:
          type: string
        name:
          type: string
        email:
          type: string
        plan:
          type: string
        status:
          type: string
        usedMessages:
          type: integer
        limitMessages:
          type: integer
        createdDate:
          type: string
          format: date-time
      required: [id, tenantKey, name, email, plan, status]
