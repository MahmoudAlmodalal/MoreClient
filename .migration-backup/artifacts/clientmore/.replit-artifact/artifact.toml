kind = "web"
previewPath = "/"
title = "clientMORE"
version = "1.0.0"
id = "artifacts/clientmore"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24441

[services.development]
run = "pnpm --filter @workspace/clientmore run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clientmore", "run", "build" ]
publicDir = "artifacts/clientmore/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24441"
BASE_PATH = "/"
