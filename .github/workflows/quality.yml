name: MoreClient quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_DATABASE_URL: sqlite:////tmp/moreclient-e2e.sqlite3
      E2E_BACKEND_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://localhost:5001

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: MoreClient/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: MoreClient
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: MoreClient
        run: pnpm exec playwright install --with-deps chromium

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run frontend lint and typecheck
        working-directory: MoreClient
        run: |
          pnpm run lint
          pnpm run typecheck

      - name: Build frontend
        working-directory: MoreClient
        run: pnpm run build

      - name: Run browser E2E tests
        working-directory: MoreClient
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: MoreClient/playwright-report
          if-no-files-found: ignore
